<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/index.css" />
    <title>Sebastian-Portafolio</title>
  </head>
  <body>
    <main class="main main__animation">
      <header class="header">
        <nav class="nav">
          <a class="nav__logo-link" href="#home" aria-label="Volver al inicio">
            <img
              src="assets/logo/Logo.png"
              class="nav__logo"
              alt="Logo del portafolio de Sebastian Terleira"
            />
            <img
              src="assets/logo/LogoInverso.png"
              class="nav__logo nav__logo--inverse"
              alt="Logo inverso del portafolio de Sebastian Terleira"
            />
          </a>
          <div class="nav__links">
            <a href="#portfolio" class="links__item">Portfolio</a>
            <a
              href="https://github.com/sebastianterleira"
              target="_blank"
              rel="noreferrer"
              class="links__item"
              >GitHub</a
            >
            <a href="#contact" class="links__item">Contact</a>
          </div>
          <div>
            <a
              target="_blank"
              href="https://drive.google.com/file/d/1YhI8HFjThw0px11mi8pc8GBvxgQksEcV/view?usp=sharing"
              class="nav__cv"
              >CV</a
            >
          </div>
        </nav>
      </header>

      <section id="home" class="home">
        <h1 class="home__title">
          Hi, I'm
          <span class="home__former-name">
            <strong class="home__emphasis">Sebastian T.</strong>, a.k.a
          </span>
          <strong class="home__emphasis home__name">Crazy Galanga.</strong>
        </h1>
        <h2 class="home__subtitle">
          Galanga Developer and
          <strong class="home__emphasis">Frontend Designer (❁´◡`❁)</strong>
        </h2>
        <div id="portfolio" class="home__divider"></div>
      </section>

      <section id="projects" class="projects">
        <article class="project-card">
          <div class="project-card__content">
            <h3 class="project-card__title">Brillaire</h3>
            <p class="project-card__type">Website</p>
            <a
              class="project-card__link"
              href="https://brillaire.vercel.app/"
              target="_blank"
              rel="noreferrer"
              >View site
            </a>
            <picture>
              <img
                src="./assets/projects/BrillaireMockup.png"
                class="img__project"
                alt="Mockup de la website de Brillaire"
              />
            </picture>
          </div>
        </article>
        <article class="project-card project-card--alternate">
          <div class="project-card__content">
            <h3 class="project-card__title">CarnesFrescas</h3>
            <p class="project-card__type">Website</p>
            <a
              class="project-card__link"
              href="https://carnes-frescas.pages.dev/"
              target="_blank"
              rel="noreferrer"
              >View site</a
            >
            <picture>
              <img
                src="./assets/projects/CarnesFrescasMockup.png"
                class="img__project"
                alt="Mockup de la website de CARNES FRESCAS"
              />
            </picture>
          </div>
        </article>
      </section>

      <section id="contact" class="contact">
        <h2>Contacto</h2>
      </section>
    </main>
  </body>
</html>
