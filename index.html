<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/index.css" />
    <title>Sebastian-Portafolio</title>
  </head>
  <body>
    <main class="main main__animation">
      <header class="header">
        <nav class="nav">
          <a class="nav__logo-link" href="#home" aria-label="Volver al inicio">
            <img src="assets/Logo.png" class="nav__logo" alt="Logo del portafolio de Sebastian Terleira" />
            <img
              src="assets/LogoInverso.png"
              class="nav__logo nav__logo--inverse"
              alt="Logo inverso del portafolio de Sebastian Terleira"
            />
          </a>
          <div class="nav__links">
            <a href="#portfolio" class="links__item">Portfolio</a>
            <a
              href="https://github.com/sebastianterleira"
              target="_blank"
              rel="noreferrer"
              class="links__item"
              >GitHub</a
            >
            <a href="#contact" class="links__item">Contact</a>
          </div>
          <div>
            <a
              target="_blank"
              href="https://drive.google.com/file/d/1Lm1AhEI5Lz-K21sh1k2ngL6AGSf8b2Zw/view?usp=sharing"
              class="nav__cv"
              >CV</a
            >
          </div>
        </nav>
      </header>
      <section id="home" class="home">
        <h1 class="home__title">
          Hi, I'm
          <span class="home__former-name">
            <strong class="home__emphasis">Sebastian T.</strong>, a.k.a
          </span>
          <strong class="home__emphasis home__name">Crazy Galanga.</strong>
        </h1>
        <h2 class="home__subtitle">
          Galanga Developer and
          <strong class="home__emphasis">Frontend Designer (❁´◡`❁)</strong>
        </h2>
        <div id="portfolio" class="home__divider"></div>
      </section>

      <section id="projects" class="projects">
        <h2>Mis proyectos</h2>
      </section>

      <section id="contact" class="contact">
        <h2>Contacto</h2>
      </section>
    </main>
  </body>
</html>
